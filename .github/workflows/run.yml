name: Treo Discord Tu Dong

on:
  # Tự động bật bot đúng 11h30 tối hàng ngày (Giờ VN)
  schedule:
    - cron: '30 16 * * *'
  repository_dispatch:
    types: [trigger-bot]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Start Bot Clone
      env:
        TOKEN: ${{ secrets.TOKEN }} 
      run: node index.js
